<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スレッドビュー for Chatwork — ストア用スクリーンショット</title>
<style>
  /*
   * Chrome Web Store のスクリーンショットは 1280 x 800。
   * この枠を画面キャプチャして提出する。LP 用には同じものを 2 倍で撮る。
   *
   * 左側は Chatwork の画面を模した背景。配色と寸法は実際の画面から
   * 取ったが、会話・氏名・ルーム名はすべて架空。実データは使わない。
   * ロゴマークは商標なので置いていない。
   *
   * 右側 (#panelHost) だけが本物で、src/ui の実装をそのまま描画している。
   */
  html, body { margin: 0; padding: 0; background: #20272c; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .shot {
    width: 1280px;
    height: 800px;
    display: grid;
    grid-template-rows: 44px minmax(0, 1fr);
    overflow: hidden;
    position: relative;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* 実際の画面から拾った配色。ライトを基準に、ダークで差し替える。 */
  .shot {
    --top:         #13202f;
    --top-dim:     #8fa4b8;
    --side:        #ebeff4;
    --side-active: #dbe7f4;
    --side-text:   #24343f;
    --head:        #ffffff;
    --feed:        #f8fafc;
    --compose:     #ffffff;
    --text:        #1b282d;
    --dim:         #5c7173;
    --faint:       #93a4ad;
    --line:        #dde4ea;
    --line-soft:   #e7ecf1;
    --re-bg:       #47b79f;
    --re-label:    #ffffff;
    --re-side:     #ffffff;
    --re-side-tx:  #1f7a68;
    --link:        #1878c8;
    --btn-line:    #c6d0d9;
  }
  .shot[data-theme="dark"] {
    --top:         #13202f;
    --top-dim:     #8fa4b8;
    --side:        #0d1723;
    --side-active: #0a275a;
    --side-text:   #d6e0e8;
    --head:        #182d46;
    --feed:        #13202f;
    --compose:     #182d46;
    --text:        #e4ecee;
    --dim:         #93a8b4;
    --faint:       #6b7f8a;
    --line:        #24384f;
    --line-soft:   #1c2e42;
    --re-bg:       #00856a;
    --re-label:    #ffffff;
    --re-side:     #0f2436;
    --re-side-tx:  #6fd8bd;
    --link:        #6fb8f0;
    --btn-line:    #3a5670;
  }

  .shot { background: var(--feed); color: var(--text); }

  /* ---- 上部の共通バー ---- */
  .top {
    background: var(--top);
    display: flex; align-items: center; gap: 14px;
    padding: 0 14px;
    color: #fff;
  }
  .top__mark {
    width: 22px; height: 22px; border-radius: 6px;
    background: #38506a; flex: 0 0 auto;
  }
  .top__search {
    width: 360px; height: 26px; border-radius: 5px;
    background: #fff; color: #90a0ad;
    display: flex; align-items: center; gap: 7px;
    padding: 0 10px; font-size: 12px;
  }
  .top__icons { margin-left: auto; display: flex; align-items: center; gap: 16px; color: var(--top-dim); }
  .top__hint { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .top__me { display: flex; align-items: center; gap: 7px; margin-left: 6px; font-size: 12px; color: #dbe4ec; }
  .top svg { display: block; }

  /* ---- 三分割 ---- */
  .main { display: grid; grid-template-columns: 224px minmax(0, 1fr) 360px; min-height: 0; }

  /* ---- 左: ルーム一覧 ---- */
  .side {
    background: var(--side); color: var(--side-text);
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--line);
  }
  .side__tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
  .side__tab {
    padding: 7px 0 6px; text-align: center; font-size: 10.5px; color: var(--dim);
    display: grid; justify-items: center; gap: 1px;
  }
  .side__tab--on { background: var(--side-active); color: var(--side-text); font-weight: 600; }
  .side__cat {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; font-size: 11.5px; color: var(--dim);
  }
  .side__list { overflow: hidden; padding-bottom: 8px; }
  .side__group { font-size: 11px; color: var(--dim); padding: 7px 10px 3px; }
  .side__room {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; font-size: 12px;
    white-space: nowrap; overflow: hidden;
  }
  .side__room--on { background: var(--side-active); border-radius: 5px; margin: 0 5px; font-weight: 600; }
  .side__av { width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; }
  .side__name { overflow: hidden; text-overflow: ellipsis; }

  /* ---- 中央: ルーム ---- */
  /* 発言一覧が伸びても入力欄を押し出さないよう、行を 3 つに固定して
     真ん中だけを縮ませる。min-height: 0 が無いと grid の子は縮まない。 */
  .room {
    display: grid; grid-template-rows: 42px minmax(0, 1fr) auto;
    min-width: 0; min-height: 0; background: var(--feed);
  }
  .room__head {
    display: flex; align-items: center; gap: 9px;
    padding: 0 12px; background: var(--head);
    border-bottom: 1px solid var(--line);
  }
  .room__av { width: 24px; height: 24px; border-radius: 50%; background: #6d8ba8; flex: 0 0 auto; }
  .room__title { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .room__members { margin-left: auto; display: flex; align-items: center; }
  .room__members .mem {
    width: 22px; height: 22px; border-radius: 50%; margin-left: -5px;
    border: 2px solid var(--head);
    display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 700;
  }
  .room__invite {
    font-size: 11.5px; padding: 2px 9px; border-radius: 4px;
    border: 1px solid var(--btn-line); color: var(--dim); margin-left: 8px;
  }
  .room__tools { display: flex; align-items: center; gap: 12px; margin-left: 12px; color: var(--faint); }

  /* ---- 中央: 発言一覧 ---- */
  .feed {
    padding: 14px 0 26px;
    min-height: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 84%, transparent 99%);
            mask-image: linear-gradient(to bottom, #000 0, #000 84%, transparent 99%);
  }
  .daysep { text-align: center; font-size: 11px; color: var(--faint); margin: 10px 0 12px; }
  .msg { display: flex; gap: 10px; padding: 7px 16px 9px; }
  .msg__av {
    width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700;
  }
  .msg__main { min-width: 0; flex: 1 1 auto; }
  .msg__head { display: flex; align-items: baseline; gap: 8px; }
  .msg__name { font-size: 12.5px; font-weight: 700; }
  .msg__org { font-size: 11px; color: var(--faint); }
  .msg__time { margin-left: auto; font-size: 11px; color: var(--faint); white-space: nowrap; }
  .msg__re {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 3px 0 3px; font-size: 11px;
  }
  .msg__reChip {
    display: inline-flex; align-items: stretch;
    border-radius: 3px; overflow: hidden; line-height: 1.6;
  }
  .msg__reChip b { background: var(--re-bg); color: var(--re-label); font-weight: 700; padding: 0 5px; }
  .msg__reChip span { background: var(--re-side); color: var(--re-side-tx); padding: 0 6px; }
  .msg__reAv { width: 17px; height: 17px; border-radius: 50%; display: inline-block; }
  .msg__reName { color: var(--dim); }
  .msg__body { font-size: 13px; line-height: 1.8; white-space: pre-line; }
  .msg__link { color: var(--link); word-break: break-all; }

  /* 実物と同じ強調。src/content/navigator.js の値をそのまま使う。 */
  .msg--hl { background-color: rgba(12, 107, 107, 0.14); }

  /* ---- 中央: 入力欄 ---- */
  .compose { background: var(--compose); border-top: 1px solid var(--line); padding: 7px 12px 12px; }
  .compose__tools { display: flex; align-items: center; gap: 14px; color: var(--faint); padding-bottom: 7px; }
  .compose__send { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: var(--dim); }
  .compose__btn {
    border: 1px solid var(--btn-line); border-radius: 4px;
    padding: 1px 14px; color: var(--faint); font-size: 11.5px;
  }
  .compose__box {
    border: 1px solid var(--btn-line); border-radius: 4px;
    padding: 8px 10px; height: 62px;
    color: var(--faint); font-size: 12px; line-height: 1.6;
  }

  /* ---- 右: 本物のパネル ---- */
  #panelHost { min-width: 0; }

  .caption {
    position: absolute; right: 374px; bottom: 150px;
    font-size: 11px; padding: 3px 10px; border-radius: 999px;
  }
  .shot[data-theme="dark"] .caption { background: #1c2429; color: #96a8ab; }
  .shot[data-theme="light"] .caption { background: #eef3f3; color: #5c7173; }
</style>
</head>
<body>

    <header class="top">

        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5"/><path d="M17 8.5a2.8 2.8 0 1 0 0-.1M18 19c0-2-1-3.6-2.6-4.4"/></svg>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="1.7"/><circle cx="12" cy="6" r="1.7"/><circle cx="18" cy="6" r="1.7"/><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/><circle cx="6" cy="18" r="1.7"/><circle cx="12" cy="18" r="1.7"/><circle cx="18" cy="18" r="1.7"/></svg>

      <aside class="side">
        <div class="side__tabs">
          <div class="side__tab side__tab--on">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-5.2A8 8 0 1 1 21 12Z"/></svg>

          </div>

            <span style="font-size:11.5px;font-weight:700">TO</span>

    <div class="caption">架空のサンプルです</div>

<script type="module">
import { PANEL_CSS } from '../../src/ui/styles.js';
import { renderThreads } from '../../src/ui/render.js';
import { buildThreads } from '../../src/core/threadTree.js';

// ---- サンプルデータ ----
// 名前も会話も架空。見本として使われる形にして、実在の人物と取り違えられないようにする。
const now = Math.floor(Date.now() / 1000);
const m = (id, name, aid, body, replyToId, minutesAgo) => ({
  id, roomId: 'R1', accountId: aid, userName: name, avatarUrl: '',
  body, replyToId, replyToRoomId: replyToId ? 'R1' : null,
  timestamp: now - minutesAgo * 60, index: Number(id),
});

const messages = [
  m('1', '山田 太郎', 'a1', '来週の定例、水曜15時からに変更できますか。先方の都合が変わりました。', null, 220),
  m('2', '鈴木 花子', 'a2', '水曜15時、こちらは問題ありません。', '1', 214),
  m('3', '佐藤 次郎', 'a3', 'すみません、水曜は別件が入っています。木曜の同時刻ではどうでしょう。', '1', 205),
  m('4', '山田 太郎', 'a1', '木曜15時で先方に確認します。少々お待ちください。', '3', 198),
  m('5', '山田 太郎', 'a1', '木曜15時で確定しました。招待を送ります。', '4', 150),

  m('6', '鈴木 花子', 'a2', '請求書のテンプレートを更新しました。次回分から新しい方を使ってください。', null, 120),
  m('7', '高橋 三郎', 'a4', '振込手数料の欄は残す形で合っていますか。', '6', 96),
  m('8', '鈴木 花子', 'a2', '残してください。表記だけ「振込手数料（先方負担）」に変えています。', '7', 88),

  m('9', '佐藤 次郎', 'a3', '新しい問い合わせフォーム、ステージング環境に上げました。確認をお願いします。', null, 64),
  m('10', '高橋 三郎', 'a4', '送信後の完了画面で、戻るボタンが二重に表示されていました。', '9', 47),
  m('11', '佐藤 次郎', 'a3', '再現しました。今日中に直します。', '10', 41),
  m('12', '山田 太郎', 'a1', '文言も一箇所だけ旧サービス名のままでした。あわせてお願いします。', '9', 33),

  m('13', '高橋 三郎', 'a4', '来月の勉強会、テーマの希望があれば今週中にお願いします。', null, 18),
  m('14', '鈴木 花子', 'a2', '設計レビューの進め方を扱ってほしいです。', '13', 9),
];

// 所属ラベル。Chatwork は社外の相手に組織名を出すので、それも架空のものを置く。
const ORG = { a3: 'サンプル商事', a4: 'サンプル商事' };

const byId = new Map(messages.map((x) => [x.id, x]));
// アイコンの色。自動生成だと色相が固まって見分けが付かないので手で振る。
const HUES = {
  a1: 210, a2: 158, a3: 276, a4: 22,
  r1: 196, r2: 42, r3: 128, r4: 322, r5: 250, r6: 8,
};
const color = (seed) => `hsl(${HUES[seed] ?? 205}, 40%, 45%)`;
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const stamp = (t) => {
  const d = new Date(t * 1000);
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}） ${hm}`;
};
const dayLabel = (t) => {
  const d = new Date(t * 1000);
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
};
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const avatar = (cls, name, aid, size) => {
  const n = el('div', cls, name.slice(0, 1));
  n.style.background = color(aid);
  if (size) {
    n.style.width = `${size}px`;
    n.style.height = `${size}px`;
  }
  return n;
};

// ---- 左のルーム一覧 (すべて架空の名前) ----
const ROOMS = [
  { group: '社内' },
  { name: 'プロジェクト連絡', aid: 'r1', on: true },
  { name: '全社アナウンス', aid: 'r2' },
  { name: '開発チーム', aid: 'r3' },
  { name: 'デザイン相談', aid: 'r4' },
  { group: '取引先' },
  { name: 'サンプル商事 様', aid: 'r5' },
  { name: 'サンプル技研 様', aid: 'r6' },
  { group: 'カテゴリー未分類のチャット' },
  { name: 'マイチャット', aid: 'a1' },
  { name: '鈴木 花子', aid: 'a2' },
  { name: '佐藤 次郎', aid: 'a3' },
  { name: '高橋 三郎', aid: 'a4' },
];
const sideList = document.getElementById('sideList');
for (const r of ROOMS) {
  if (r.group) {
    sideList.appendChild(el('div', 'side__group', `▾ ${r.group}`));
    continue;
  }
  const row = el('div', r.on ? 'side__room side__room--on' : 'side__room');
  const av = el('span', 'side__av');
  av.style.background = color(r.aid);
  row.append(av, el('span', 'side__name', r.name));
  sideList.appendChild(row);
}

// ---- ルームヘッダのメンバー ----
const roomMembers = document.getElementById('roomMembers');
for (const [name, aid] of [['山田 太郎', 'a1'], ['鈴木 花子', 'a2'], ['佐藤 次郎', 'a3'], ['高橋 三郎', 'a4']]) {
  roomMembers.appendChild(avatar('mem', name, aid));
}

// ---- 中央の発言一覧 ----
const feed = document.getElementById('feed');
let lastDay = null;
for (const msg of messages.slice(5)) {
  const day = dayLabel(msg.timestamp);
  if (day !== lastDay) {
    feed.appendChild(el('div', 'daysep', day));
    lastDay = day;
  }

  // 強調は 1 件だけ。実物もジャンプ先を 1 件だけ光らせる。
  const row = el('div', msg.id === '11' ? 'msg msg--hl' : 'msg');
  row.appendChild(avatar('msg__av', msg.userName, msg.accountId));

  const main = el('div', 'msg__main');
  const head = el('div', 'msg__head');
  head.append(el('span', 'msg__name', msg.userName));
  if (ORG[msg.accountId]) head.append(el('span', 'msg__org', ORG[msg.accountId]));
  head.append(el('span', 'msg__time', stamp(msg.timestamp)));
  main.appendChild(head);

  if (msg.replyToId) {
    const parent = byId.get(msg.replyToId);
    const re = el('div', 'msg__re');
    const chip = el('span', 'msg__reChip');
    chip.append(el('b', null, '↩ RE'), el('span', null, '返信元'));
    const reAv = el('span', 'msg__reAv');
    reAv.style.background = color(parent.accountId);
    re.append(chip, reAv, el('span', 'msg__reName', `${parent.userName}さん`));
    main.appendChild(re);
  }

  main.appendChild(el('div', 'msg__body', msg.body));
  row.appendChild(main);
  feed.appendChild(row);
}

// ---- 右: 実物のパネル UI をそのまま描画する ----
const host = document.getElementById('panelHost');
const shadow = host.attachShadow({ mode: 'open' });
const style = document.createElement('style');
style.textContent = PANEL_CSS;

const panel = document.createElement('div');
panel.className = 'panel';
panel.dataset.theme = document.getElementById('shot').dataset.theme;
panel.innerHTML = `
  <header class="panel__head">
    <span class="panel__title">スレッド</span>
    <span class="panel__count">4 件</span>
    <span class="panel__spacer"></span>
    <button class="panel__btn" type="button">全件表示</button>
    <button class="panel__btn" type="button">閉じる</button>
  </header>
  <div class="panel__body" data-role="body"></div>
`;
shadow.append(style, panel);

const threads = buildThreads(messages);
renderThreads(shadow.querySelector('[data-role="body"]'), threads, {
  hideEmpty: true,
  openIds: new Set(['9']),
  onToggle: () => {},
  onJump: () => {},
});

const params = new URLSearchParams(location.search);

// テーマ切替（?theme=light で明るい配色を撮影できる）
if (params.get('theme') === 'light') {
  document.getElementById('shot').dataset.theme = 'light';
  panel.dataset.theme = 'light';
}

// 撮影モード（?shot=1）。
// 枠の外をマゼンタで塗り、切り出し処理が枠の範囲を自動検出できるようにする。
// 拡大して描画してから縮小する方が文字が締まるので zoom を掛けておく。
if (params.get('shot') === '1') {
  document.documentElement.style.background = '#ff00ff';
  document.body.style.cssText =
    'margin:0;padding:0;display:block;background:#ff00ff';
  document.getElementById('shot').style.zoom = params.get('zoom') || '1.25';
}
</script>
</body>
</html>
