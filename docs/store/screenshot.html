<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スレッドビュー for Chatwork — ストア用スクリーンショット</title>
<style>
  /*
   * Chrome Web Store のスクリーンショットは 1280 x 800。
   * この枠を画面キャプチャして提出する。
   *
   * 左側はサンプルの会話一覧。特定サービスの画面を模したものではなく、
   * パネルの表示内容と対応させるための背景として置いている。
   */
  html, body { margin: 0; padding: 0; background: #20272c; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .shot {
    width: 1280px;
    height: 800px;
    display: grid;
    grid-template-columns: 1fr 400px;
    overflow: hidden;
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    position: relative;
  }
  .shot[data-theme="dark"] { background: #10151a; color: #e4ecee; }
  .shot[data-theme="light"] { background: #ffffff; color: #0e1a1b; }

  .feed {
    padding: 28px 30px 56px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 88%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0, #000 88%, transparent 100%);
  }
  .feed__room {
    font-size: 15px; font-weight: 600; margin: 0 0 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .feed__dot { width: 9px; height: 9px; border-radius: 50%; background: #34b6ab; }
  .msg { display: flex; gap: 12px; margin-bottom: 18px; }
  .msg__av {
    width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 700;
  }
  .msg__main { min-width: 0; }
  .msg__head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
  .msg__name { font-size: 13px; font-weight: 600; }
  .msg__time { font-size: 11px; opacity: 0.5; }
  .msg__re {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    margin-bottom: 4px;
  }
  .shot[data-theme="dark"] .msg__re { background: #1c2429; color: #96a8ab; }
  .shot[data-theme="light"] .msg__re { background: #eef3f3; color: #5c7173; }
  .msg__body { font-size: 13px; line-height: 1.75; opacity: 0.92; }
  .msg--hl { border-radius: 8px; padding: 8px 10px; margin-left: -10px; }
  .shot[data-theme="dark"] .msg--hl { background: rgba(52, 182, 171, 0.14); }
  .shot[data-theme="light"] .msg--hl { background: rgba(15, 138, 131, 0.10); }

  .caption {
    position: absolute; left: 30px; bottom: 16px;
    font-size: 11px; padding: 3px 10px; border-radius: 999px;
  }
  .shot[data-theme="dark"] .caption { background: #1c2429; color: #96a8ab; }
  .shot[data-theme="light"] .caption { background: #eef3f3; color: #5c7173; }
  #panelHost { height: 800px; }
</style>
</head>
<body>
  <div class="shot" data-theme="dark" id="shot">
    <div class="feed" id="feed"></div>
    <div id="panelHost"></div>
    <div class="caption">表示例（サンプルデータ）</div>
  </div>

<script type="module">
import { PANEL_CSS } from '../../src/ui/styles.js';
import { renderThreads } from '../../src/ui/render.js';
import { buildThreads } from '../../src/core/threadTree.js';

// ---- サンプルデータ（実在の人物・組織とは関係ありません） ----
const now = Math.floor(Date.now() / 1000);
const m = (id, name, aid, body, replyToId, minutesAgo) => ({
  id, roomId: 'R1', accountId: aid, userName: name, avatarUrl: '',
  body, replyToId, replyToRoomId: replyToId ? 'R1' : null,
  timestamp: now - minutesAgo * 60, index: Number(id),
});

const messages = [
  m('1', '田中 美咲', 'a1', '来週の定例、水曜15時からに変更できますか。先方の都合が変わりました。', null, 220),
  m('2', '佐藤 健一', 'a2', '水曜15時、こちらは問題ありません。', '1', 214),
  m('3', '鈴木 由紀', 'a3', 'すみません、水曜は別件が入っています。木曜の同時刻ではどうでしょう。', '1', 205),
  m('4', '田中 美咲', 'a1', '木曜15時で先方に確認します。少々お待ちください。', '3', 198),
  m('5', '田中 美咲', 'a1', '木曜15時で確定しました。招待を送ります。', '4', 150),

  m('6', '佐藤 健一', 'a2', '請求書のテンプレートを更新しました。次回分から新しい方を使ってください。', null, 120),
  m('7', '高橋 誠', 'a4', '振込手数料の欄は残す形で合っていますか。', '6', 96),
  m('8', '佐藤 健一', 'a2', '残してください。表記だけ「振込手数料（先方負担）」に変えています。', '7', 88),

  m('9', '鈴木 由紀', 'a3', '新しい問い合わせフォーム、ステージング環境に上げました。確認をお願いします。', null, 64),
  m('10', '高橋 誠', 'a4', '送信後の完了画面で、戻るボタンが二重に表示されていました。', '9', 47),
  m('11', '鈴木 由紀', 'a3', '再現しました。今日中に直します。', '10', 41),
  m('12', '田中 美咲', 'a1', '文言も一箇所だけ旧サービス名のままでした。あわせてお願いします。', '9', 33),

  m('13', '高橋 誠', 'a4', '来月の勉強会、テーマの希望があれば今週中にお願いします。', null, 18),
  m('14', '佐藤 健一', 'a2', '設計レビューの進め方を扱ってほしいです。', '13', 9),
];

// ---- 左側の会話一覧 ----
const byId = new Map(messages.map((x) => [x.id, x]));
const color = (seed) => {
  let h = 0;
  for (let i = 0; i < seed.length; i += 1) h = (h * 31 + seed.charCodeAt(i)) % 360;
  return `hsl(${h}, 42%, 42%)`;
};
const fmt = (t) => {
  const d = new Date(t * 1000);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};
const feed = document.getElementById('feed');
const room = document.createElement('p');
room.className = 'feed__room';
const dot = document.createElement('span');
dot.className = 'feed__dot';
room.append(dot, document.createTextNode('プロジェクト連絡'));
feed.appendChild(room);

for (const msg of messages.slice(5)) {
  const row = document.createElement('div');
  row.className = msg.id === '11' ? 'msg msg--hl' : 'msg';
  const av = document.createElement('div');
  av.className = 'msg__av';
  av.style.background = color(msg.accountId);
  av.textContent = msg.userName.slice(0, 1);
  const main = document.createElement('div');
  main.className = 'msg__main';
  const head = document.createElement('div');
  head.className = 'msg__head';
  const nm = document.createElement('span');
  nm.className = 'msg__name';
  nm.textContent = msg.userName;
  const tm = document.createElement('span');
  tm.className = 'msg__time';
  tm.textContent = fmt(msg.timestamp);
  head.append(nm, tm);
  main.appendChild(head);
  if (msg.replyToId) {
    const re = document.createElement('span');
    re.className = 'msg__re';
    re.textContent = `返信元: ${byId.get(msg.replyToId).userName}`;
    main.appendChild(re);
    main.appendChild(document.createElement('br'));
  }
  const bd = document.createElement('div');
  bd.className = 'msg__body';
  bd.textContent = msg.body;
  main.appendChild(bd);
  row.append(av, main);
  feed.appendChild(row);
}

// ---- 実物のパネル UI をそのまま描画する ----
const host = document.getElementById('panelHost');
const shadow = host.attachShadow({ mode: 'open' });
const style = document.createElement('style');
style.textContent = PANEL_CSS;

const panel = document.createElement('div');
panel.className = 'panel';
panel.dataset.theme = document.getElementById('shot').dataset.theme;
panel.innerHTML = `
  <header class="panel__head">
    <span class="panel__title">スレッド</span>
    <span class="panel__count">4 件</span>
    <span class="panel__spacer"></span>
    <button class="panel__btn" type="button">全件表示</button>
    <button class="panel__btn" type="button">閉じる</button>
  </header>
  <div class="panel__body" data-role="body"></div>
`;
shadow.append(style, panel);

const threads = buildThreads(messages);
renderThreads(shadow.querySelector('[data-role="body"]'), threads, {
  hideEmpty: true,
  openIds: new Set(['9']),
  onToggle: () => {},
  onJump: () => {},
});

const params = new URLSearchParams(location.search);

// テーマ切替（?theme=light で明るい配色を撮影できる）
if (params.get('theme') === 'light') {
  document.getElementById('shot').dataset.theme = 'light';
  panel.dataset.theme = 'light';
}

// 撮影モード（?shot=1）。
// 枠の外をマゼンタで塗り、切り出し処理が枠の範囲を自動検出できるようにする。
// 拡大して描画してから縮小する方が文字が締まるので zoom を掛けておく。
if (params.get('shot') === '1') {
  document.documentElement.style.background = '#ff00ff';
  document.body.style.cssText =
    'margin:0;padding:0;display:block;background:#ff00ff';
  document.getElementById('shot').style.zoom = params.get('zoom') || '1.25';
}
</script>
</body>
</html>
